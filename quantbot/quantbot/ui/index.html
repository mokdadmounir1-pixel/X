<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>quantbot — laboratoire</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#14171f;--mute:#5a6372;--line:#e2e5ec;--ok:#0f7a43;--okbg:#e3f4ea;--bad:#b3261e;--badbg:#fbe8e6;--warn:#8a5a00;--warnbg:#fff2d3;--acc:#2554d6;--accbg:#e7edfc;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#0e1015;--card:#161a22;--ink:#e8eaf0;--mute:#9aa3b3;--line:#272d39;--ok:#4cc38a;--okbg:#10281d;--bad:#ff8a80;--badbg:#341a17;--warn:#f0b64a;--warnbg:#2d2411;--acc:#7b9bff;--accbg:#18213d;--shadow:none}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top{max-width:1180px;margin:0 auto;padding:10px 16px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.01em;font-size:17px}.brand small{font-weight:500;color:var(--mute);margin-left:6px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--line);color:var(--mute);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.acc{background:var(--accbg);color:var(--acc)}
nav{max-width:1180px;margin:0 auto;padding:8px 16px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
nav button{border:0;background:none;color:var(--mute);padding:9px 14px;border-bottom:3px solid transparent;cursor:pointer;font:inherit;font-weight:600;white-space:nowrap}
nav button:hover{color:var(--ink)}nav button[aria-selected=true]{color:var(--acc);border-bottom-color:var(--acc)}
main{max-width:1180px;margin:0 auto;padding:16px}
h2{font-size:16px;margin:0 0 8px;letter-spacing:-.005em}h3{font-size:12.5px;margin:16px 0 6px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.banner{padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-weight:600;margin:8px 0}
.banner.ok{background:var(--okbg);color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}.kpi b{display:block;font-size:21px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}.kpi span{color:var(--mute);font-size:12.5px}
.kpi.good b{color:var(--ok)}.kpi.badk b{color:var(--bad)}
.twocol{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}@media(max-width:860px){.twocol{grid-template-columns:1fr}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}.tw table{border:0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{color:var(--mute);font-weight:700;font-size:12px;position:sticky;top:0;background:var(--card);z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--accbg)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700}
.PASS{background:var(--okbg);color:var(--ok)}.WATCH{background:var(--warnbg);color:var(--warn)}.FAIL{background:var(--badbg);color:var(--bad)}.NA{background:var(--line);color:var(--mute)}
.gates{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.g{font-size:12px;padding:1px 7px;border-radius:5px;background:var(--okbg);color:var(--ok)}.g.x{background:var(--badbg);color:var(--bad)}
.muted{color:var(--mute);font-size:13px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);font-weight:600}
select,input,button.go,button.sm{font:inherit;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.go{background:var(--acc);color:#fff;border-color:var(--acc);cursor:pointer;font-weight:700}button.go:disabled{opacity:.55;cursor:wait}
button.sm{padding:5px 10px;font-size:13px;cursor:pointer}button.sm:hover{border-color:var(--acc)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--ink);padding:6px 11px;cursor:pointer;font:inherit;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}.seg button[aria-pressed=true]{background:var(--acc);color:#fff}
svg{width:100%;height:auto;display:block}.axis{stroke:var(--line)}.lbl{fill:var(--mute);font-size:11px}.lblb{fill:var(--ink);font-size:11.5px;font-weight:700}
details{margin-top:6px}summary{cursor:pointer;color:var(--acc)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--acc)}.bar.beta i{background:var(--warn)}
tr.sel{background:var(--accbg)!important;outline:2px solid var(--acc);outline-offset:-2px}tr.sel td{font-weight:600}
td.win{color:var(--ok)}td.lose{color:var(--bad)}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;margin:8px 0}@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}html{scroll-behavior:auto}}
.hint{border-left:3px solid var(--acc);padding:6px 10px;background:var(--accbg);border-radius:0 8px 8px 0;margin:8px 0;font-size:13px}
.toast{position:fixed;right:14px;bottom:14px;max-width:420px;background:var(--bad);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:50}
code{background:var(--line);padding:1px 5px;border-radius:5px;font-size:12.5px}
</style>
</head>
<body>
<header>
  <div class="top"><div class="brand">quantbot<small>laboratoire de trading quantitatif</small></div><div class="pills" id="pills"></div></div>
  <nav role="tablist" id="tabs" aria-label="Sections"></nav>
</header>
<main>
  <div id="banner" class="banner">Chargement…</div>
  <section id="view" aria-live="polite"><div class="card"><div class="skel" style="width:40%"></div><div class="skel"></div><div class="skel" style="width:80%"></div></div></section>
</main>
<script>
function gatesHtml(gs){return `<div class="gates">`+gs.map(g=>`<span class="g ${g.ok?"":"x"}" title="valeur: ${esc(JSON.stringify(g.value))} · seuil: ${esc(JSON.stringify(g.threshold))}">${esc(g.name)}${g.eliminatory&&!g.ok?" ⛔":""}</span>`).join("")+`</div>`;}
function res(){return battery()+S.specs.map(sp=>`<div class="card"><h2>${esc(sp.name)} ${sp.parent?`<span class="muted">← ${esc(sp.parent)}</span>`:""}</h2>
  <p class="muted">${esc(sp.change_reason||sp.hypothesis||"")}</p>
  <table><thead><tr><th>Instrument</th><th>Verdict</th><th class="n">Trades</th><th class="n">Espérance (R)</th><th class="n">PF</th><th class="n">Pire trade (R)</th></tr></thead><tbody>`+
  sp.results.map(r=>r.verdict?`<tr><td>${esc(r.instrument)}</td><td>${tag(r.verdict)}</td><td class="n">${r.n_trades}</td><td class="n">${f(r.expectancy_R)}</td><td class="n">${f(r.profit_factor,2)}</td><td class="n">${f(r.worst_trade_R,2)}</td></tr>
  <tr><td colspan="6">${gatesHtml(r.gates)}<details><summary>pourquoi</summary><div class="muted">${esc(r.reason)}</div></details></td></tr>`:
  `<tr><td>${esc(r.instrument)}</td><td>${tag(null)}</td><td colspan="4" class="muted">${esc(r.status||"en cours")}</td></tr>`).join("")+`</tbody></table></div>`).join("")+
  `<p class="muted">⛔ = porte éliminatoire en échec. Les espérances de v1/v2 sont en R <i>nominal</i> (capital × risque visé) ; elles ne sont pas directement comparables à celles de v0.</p>`;}
function battery(){const b=S.battery;if(!b)return"";
  const rows=Object.entries(b.results).sort((a,c)=>c[1].t_nw-a[1].t_nw);
  return `<div class="card"><h2>Batterie d'hypothèses documentées <span class="muted">(rendements journaliers, période de recherche)</span></h2>
  <p class="muted">Reality Check de White sur ${b.n_hypotheses} hypothèses (${b.days} jours) : <b>p = ${f(b.reality_check.p,3)}</b>. Seule la MEILLEURE est couverte par cette p-value ; les autres « WATCH » ne prouvent rien.</p>
  <table><thead><tr><th>Instrument | hypothèse</th><th class="n">Jours</th><th class="n">bps/jour</th><th class="n">coûts ×2</th><th class="n">Sharpe</th><th class="n">t NW</th><th class="n">alpha t</th><th>Verdict</th></tr></thead><tbody>`+
  rows.map(([k,s])=>`<tr><td>${esc(k.replace("|"," · "))}</td><td class="n">${s.n_days}</td><td class="n">${f(s.mean_bps,2)}</td><td class="n">${f(s.mean_bps_costs_x2,2)}</td><td class="n">${f(s.sharpe_annual,2)}</td><td class="n">${f(s.t_nw,2)}</td><td class="n">${f(s.bh_t_alpha,2)}</td><td>${tag(s.verdict==="SURVIVANT"?"PASS":s.verdict==="WATCH"?"WATCH":"FAIL")}</td></tr>`).join("")+
  `</tbody></table><p class="muted">Piste la plus intéressante : <b>or, dérive nocturne</b> (+66 % du gain cumulé vient des nuits, +10 % des jours) — mais un seul régime haussier, swap non modélisé, alpha non significatif. Voir reports/battery_v1/NOTES.md.</p></div>`;}
function bars(rows,key1,key2,title){const W=520,H=190,pad=34;const vals=rows.flatMap(r=>[r[key1],r[key2]]).filter(v=>v!=null);if(!vals.length)return"";
  const lo=Math.min(-.05,...vals),hi=Math.max(.05,...vals),y=v=>pad+(hi-v)/(hi-lo)*(H-2*pad),bw=(W-2*pad)/rows.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}"><line class="axis" x1="${pad}" x2="${W-pad}" y1="${y(0)}" y2="${y(0)}"/>`;
  rows.forEach((r,i)=>{const x=pad+i*bw;[[key1,"var(--mute)",0],[key2,"var(--acc)",1]].forEach(([k,c,j])=>{const v=r[k];if(v==null)return;
    s+=`<rect x="${x+bw*(.12+.42*j)}" width="${bw*.38}" y="${Math.min(y(0),y(v))}" height="${Math.abs(y(v)-y(0))}" fill="${c}"><title>${esc(r.score)} · ${k}: ${f(v,4)} R (n=${r[k==key1?"n_train":"n_valid"]})</title></rect>`});
    s+=`<text class="lbl" x="${x+bw/2}" y="${H-12}" text-anchor="middle">${esc(r.score.replace(/[\[\)]/g,"").split(",")[0])}</text>`});
  return s+`<text class="lbl" x="${pad}" y="14">${esc(title)}</text></svg>`;}
function cal(){const v2=S.specs.find(s=>s.name==="v2_calibrated");if(!v2)return`<div class="card">Pas de résultat v2.</div>`;
  return `<div class="card"><h2>Calibration score → espérance nette</h2><p class="muted">Pour chaque niveau de score flou : espérance moyenne en R nominal, <span style="color:var(--mute)">■ apprentissage</span> vs <span style="color:var(--acc)">■ validation (hors échantillon)</span>. Une courbe qui monte et se confirme serait un edge ; une courbe plate sous zéro = les coûts seuls.</p></div>`+
  v2.results.filter(r=>r.diagnostics).map(r=>`<div class="card"><h2>${esc(r.instrument)} ${tag(r.verdict)}</h2><div class="grid"><div>${bars(r.diagnostics.long,"E_train","E_valid","Achat (score haussier)")}</div><div>${bars(r.diagnostics.short,"E_train","E_valid","Vente (score baissier)")}</div></div>
  <p class="muted">Placebo (part de barres jugées tradables sur des labels permutés) : achat ${f(r.diagnostics.placebo_share_above_margin.long,3)} · vente ${f(r.diagnostics.placebo_share_above_margin.short,3)} — mesure de ce que la méthode invente à vide.</p></div>`).join("");}
function autoCard(){const d=S.daemon,q=S.queue;const age=d?(Date.now()/1000-d.ts):null;
  return `<div class="card"><h2>Automatisation 24 h/24</h2><div class="grid">
  <div class="kpi"><b>${!d?"jamais lancé":age<180?(d.connected?"actif":"terminal déconnecté"):"arrêté"}</b><span>Extraction MT5 (data_daemon)${d?` · dernier passage il y a ${ago(age)}`:""}</span></div>
  <div class="kpi"><b>${d?(d.chain_ok?"intègre":"ALTÉRÉE"):"—"}</b><span>Chaîne du journal de données</span></div>
  <div class="kpi"><b>${q?q.n_trials+" / "+q.budget:"—"}</b><span>Essais de la file de recherche</span></div>
  <div class="kpi"><b>${q?(q.pending||[]).length:"—"}</b><span>Specs en attente (${q?Object.keys(q.blocked||{}).length:0} bloquées)</span></div></div>
  ${d&&d.series&&d.series.length?`<table style="margin-top:10px"><thead><tr><th>Série</th><th>Statut</th><th class="n">Barres ajoutées</th></tr></thead><tbody>`+d.series.map(x=>`<tr><td>${esc(x.symbol)} ${esc(x.tf||"")}</td><td>${esc(x.status)}${x.anomalies?` ⚠ ${x.anomalies} barre(s) modifiée(s)`:""}</td><td class="n">${x.appended??""}</td></tr>`).join("")+`</tbody></table>`:""}
  ${q&&Object.keys(q.blocked||{}).length?`<p class="muted">Bloquées : ${Object.entries(q.blocked).map(([k,v])=>esc(k)+" ("+esc(v)+")").join(" · ")}</p>`:""}
  <p class="muted">Le démon lit MT5 en lecture seule (aucun ordre) ; la file n'exécute que des specs préenregistrées, une fois chacune, dans le budget d'essais.</p></div>`;}
function data(){return autoCard()+`<div class="card"><h2>Données (exports MetaTrader 5, démo MetaQuotes)</h2><table><thead><tr><th>Symbole</th><th class="n">Barres</th><th>Début</th><th>Fin</th><th class="n">Années</th><th>SHA-256</th></tr></thead><tbody>`+
  S.data.map(d=>`<tr><td>${esc(d.symbol)}</td><td class="n">${d.rows}</td><td>${esc((d.start||"").slice(0,10))}</td><td>${esc((d.end||"").slice(0,10))}</td><td class="n">${f(d.span_years,2)}</td><td class="muted">${esc((d.sha256||"").slice(0,16))}…</td></tr>`).join("")+`</tbody></table>
  <ul class="muted">${S.data_notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div>`;}
function wf(){const W=S.walkforward||[];if(!W.length)return `<div class="card"><h2>Optimisation en marche avant</h2><p class="muted">Aucun résultat : lancez <code>python scripts\\optimize.py specs\\wf_v1.json</code>.</p></div>`;
  return `<div class="card"><h2>Optimisation en marche avant (walk-forward)</h2>
  <p class="muted">Les paramètres sont choisis sur une fenêtre d'entraînement puis jugés sur la fenêtre suivante, jamais vue. Seul le résultat HORS ÉCHANTILLON compte ;
  « écart d'optimisme » = ce que l'entraînement promettait moins ce que le test a donné. Chaque balayage = 1 essai au registre. Période verrouillée non lue.</p></div>`+
  W.map(r=>{const m=r.summary;return `<div class="card"><h2>${esc(r.instrument)} · ${esc(r.strategy)} <span class="muted">${esc(r.spec)} · ${r.n_configs} configurations</span></h2><div class="grid">
   <div class="kpi"><b>${f(m.oos_expectancy_R)} R</b><span>Espérance hors échantillon (${m.n_oos_trades} trades)</span></div>
   <div class="kpi"><b>${f(m.oos_profit_factor,2)}</b><span>Facteur de profit hors échantillon</span></div>
   <div class="kpi"><b>${f(m.optimism_gap_R)} R</b><span>Écart d'optimisme</span></div>
   <div class="kpi"><b>${f(m.unselected_average_config_oos_R)} R</b><span>Config moyenne non sélectionnée</span></div>
   <div class="kpi"><b>${m.oos_sign_flip_p==null?"—":f(m.oos_sign_flip_p,3)}</b><span>p (test de signe)</span></div>
   <div class="kpi"><b>${m.n_windows_traded}/${m.n_windows}</b><span>Fenêtres tradées</span></div></div>
   <table style="margin-top:10px"><thead><tr><th>Test du</th><th>au</th><th>Choix (sur l'entraînement)</th><th class="n">E entraîn.</th><th class="n">trades test</th><th class="n">E test</th></tr></thead><tbody>`+
   (r.windows||[]).map(w=>`<tr><td>${esc((w.test_start||"").slice(0,10))}</td><td>${esc((w.test_end||"").slice(0,10))}</td><td class="muted">${esc(w.chosen||w.note||"—")}</td><td class="n">${f(w.train_E)}</td><td class="n">${w.oos_n??"—"}</td><td class="n">${f(w.oos_E)}</td></tr>`).join("")+`</tbody></table></div>`;}).join("");}
function ago(x){if(x==null)return "—";x=Math.round(x);return x<90?x+" s":x<5400?Math.round(x/60)+" min":(x/3600).toFixed(1)+" h";}
function when(t){return t?new Date(t*1000).toISOString().replace("T"," ").slice(0,19)+" UTC":"—";}
function liveChart(){const B=L.bars||[];if(B.length<2)return `<p class="muted">Aucune barre publiée par le lanceur pour l'instant.</p>`;
  const W=960,H=360,pl=8,pr=118,pt=22,pb=22;const tm=s=>Date.parse(String(s).replace(" ","T"));
  const lv=[];const pos=L.position,pen=L.pending;if(pos)lv.push(pos.entry,pos.stop,pos.tp);if(pen)lv.push(pen.entry,pen.stop,pen.tp);
  const closed=(L.paper_trades||[]).filter(t=>t.entry_time&&tm(t.exit_time)>=tm(B[0][0]));closed.forEach(t=>{lv.push(t.entry,t.exit);if(t.stop)lv.push(t.stop);if(t.tp)lv.push(t.tp);});
  const hi=Math.max(...B.map(b=>b[2]),...lv),lo=Math.min(...B.map(b=>b[3]),...lv),y=v=>pt+(hi-v)/(hi-lo||1)*(H-pt-pb),n=B.length,bw=(W-pl-pr)/n,x=i=>pl+(i+.5)*bw;
  const idx=t=>{const T=tm(t);let k=0;for(let i=0;i<n;i++){if(tm(B[i][0])<=T)k=i;}return k;};
  const candles=B.map((b,i)=>{const up=b[4]>=b[1],c=up?"var(--ok)":"var(--bad)";return `<line x1="${x(i)}" x2="${x(i)}" y1="${y(b[2])}" y2="${y(b[3])}" stroke="${c}"/><rect x="${x(i)-Math.max(bw*.35,.6)}" width="${Math.max(bw*.7,1.2)}" y="${y(Math.max(b[1],b[4]))}" height="${Math.max(Math.abs(y(b[1])-y(b[4])),1)}" fill="${c}"/>`;}).join("");
  const line=(v,col,lbl,dash)=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${col}" stroke-width="1.5" ${dash?'stroke-dasharray="6 4"':''}/><text class="lbl" x="${W-pr+4}" y="${y(v)+4}" fill="${col}">${lbl} ${v.toFixed(2)}</text>`;
  let ov="";
  if(pos){ov+=line(pos.entry,"var(--acc)","ENTRÉE")+line(pos.stop,"var(--bad)","STOP")+line(pos.tp,"var(--ok)","TP");}
  if(pen){ov+=line(pen.entry,"var(--acc)","ordre (ouv. suiv.)",1)+line(pen.stop,"var(--bad)","stop prévu",1)+line(pen.tp,"var(--ok)","tp prévu",1);}
  closed.forEach(t=>{const a=idx(t.entry_time),b=idx(t.exit_time),col=t.r>=0?"var(--ok)":"var(--bad)";
    ov+=`<line x1="${x(a)}" y1="${y(t.entry)}" x2="${x(b)}" y2="${y(t.exit)}" stroke="${col}" stroke-width="2.5"><title>${esc(t.side)} · ${esc(t.reason)} · ${f(t.r,2)} R${t.stop?` · stop ${f(t.stop,2)} · tp ${f(t.tp,2)}`:""}</title></line><circle cx="${x(a)}" cy="${y(t.entry)}" r="4" fill="${t.side==="long"?"var(--acc)":"var(--warn)"}"/>`
    +(t.stop?`<line x1="${x(a)}" x2="${x(b)}" y1="${y(t.stop)}" y2="${y(t.stop)}" stroke="var(--bad)" stroke-dasharray="3 3" opacity=".6"/>`:"")+(t.tp?`<line x1="${x(a)}" x2="${x(b)}" y1="${y(t.tp)}" y2="${y(t.tp)}" stroke="var(--ok)" stroke-dasharray="3 3" opacity=".6"/>`:"");});
  const last=B[n-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="graphique en direct"><text class="lbl" x="${pl}" y="14">${esc(L.symbol||"")} · barres clôturées (${n}) · dernière : ${esc(String(last[0]).slice(0,16))} · clôture ${last[4].toFixed(2)}</text>${candles}${ov}</svg>

  À 1 R = ${pc(risk,1)} du capital, ${f(o.target_r_per_day,2)} R/jour ≈ ${f(10/(daily*100),0)} jours ouvrés pour les 10 % de la phase 1 FTMO <i>sans aucun jour perdant</i> : c'est un niveau très élevé.</div>
  <h3>Classement par R/jour (tous les essais)</h3>

  o.rows.map(r=>`<tr><td>${esc(r.name)} <span class="muted">${esc(r.spec)}</span></td><td>${tag(r.verdict)}</td><td class="n">${r.n_trades}</td><td class="n">${sg(r.expectancy_R,3)}</td><td class="n"><b>${f(r.r_per_day,3)}</b></td><td>${gauge(r.r_per_day,o.target_r_per_day,!!r.beta)}</td>

/* ---------- Tester une stratégie : entrées, SL, TP, sorties ---------- */
function essai(){
  const strat=ST?ST.strategies:[];const allowed=id=>id==="patterns"?ST.patterns.instruments:(strat.find(s=>s.id===id)||{instruments:[]}).instruments;
  const insts=ST?allowed(E.strategy):[];if(ST&&!insts.includes(E.instrument))E.instrument=insts[0];
  const deep=ST&&ST.deep_available&&ST.deep_available[E.instrument];
  return `<div class="card"><h2>Tester une stratégie, trade par trade</h2>
  <p class="muted">Chaque trade est tracé avec son <b>entrée</b>, son <b>stop (SL)</b>, son <b>objectif (TP)</b> et sa <b>sortie</b>. Période de recherche ou années d'avant uniquement : la période verrouillée n'est jamais renvoyée. Aucun ordre.</p>
  ${ST?`<div class="row"><label class="f">Stratégie<select id="es">${strat.map(s=>`<option value="${s.id}" ${s.id===E.strategy?"selected":""}>${esc(s.label)}</option>`).join("")}<option value="patterns" ${E.strategy==="patterns"?"selected":""}>${esc(ST.patterns.label)}</option></select></label>
  <label class="f">Instrument<select id="ei">${insts.map(i=>`<option ${i===E.instrument?"selected":""}>${i}</option>`).join("")}</select></label>
  <label class="f">Période<select id="eg"><option value="recherche" ${E.segment==="recherche"?"selected":""}>Recherche (récent)</option><option value="avant" ${E.segment==="avant"?"selected":""} ${deep?"":"disabled"}>Années d'avant ${deep?"":"(historique profond absent)"}</option></select></label>
  <label class="f">Barres<select id="eb">${[3000,6000,12000].map(b=>`<option ${b===E.bars?"selected":""}>${b}</option>`).join("")}</select></label>
  <button class="go" id="ego">Lancer le test</button></div><p class="muted" id="enote">${esc((strat.find(s=>s.id===E.strategy)||{}).note||"")}</p>`:`<div class="skel"></div><div class="skel" style="width:60%"></div>`}
  </div><div id="eout">${R?explorer():`<div class="card muted">Choisissez une stratégie puis « Lancer le test » : les trades apparaissent ici avec leurs entrées, stops et objectifs.</div>`}</div>`;}
function bindEssai(){const g=id=>document.getElementById(id);if(!g("ego"))return;
  g("es").onchange=()=>{E.strategy=g("es").value;render();};g("ei").onchange=()=>{E.instrument=g("ei").value;render();};
  g("eg").onchange=()=>{E.segment=g("eg").value};g("eb").onchange=()=>{E.bars=+g("eb").value};g("ego").onclick=runEssai;if(R)bindExplorer();}
async function runEssai(){const b=document.getElementById("ego");b.disabled=true;b.textContent="Calcul… (5 à 60 s)";
  try{R=await api(`/api/strategy_replay?instrument=${E.instrument}&bars=${E.bars}&strategy=${E.strategy}&segment=${E.segment}`);E.sel=0;E.filter="all";E.sort=["i",1];document.getElementById("eout").innerHTML=explorer();bindExplorer();}
  catch(e){toast("Erreur : "+e.message)}b.disabled=false;b.textContent="Lancer le test";}
function visible(){const T=R.trades.map((t,i)=>({...t,i}));let v=T;
  if(E.filter==="win")v=T.filter(t=>t.r>0);else if(E.filter==="loss")v=T.filter(t=>t.r<=0);else if(E.filter==="tp")v=T.filter(t=>t.reason==="take_profit");
  else if(E.filter==="sl")v=T.filter(t=>t.reason==="stop_loss");else if(E.filter==="time")v=T.filter(t=>!["take_profit","stop_loss"].includes(t.reason));
  const [k,d]=E.sort;return v.slice().sort((a,b)=>(a[k]>b[k]?1:a[k]<b[k]?-1:0)*d);}
function reasonLabel(k){return {take_profit:"Objectif atteint (TP)",stop_loss:"Stop touché (SL)",max_hold:"Durée maximale (sortie au temps)",weekend:"Fermeture avant le week-end",ftmo_weekend:"Fermeture avant le week-end (FTMO)",end:"Fin des données",data_hole:"Trou de données",ftmo_flatten:"Fermeture garde-fou FTMO",server_exit:"Sortie serveur"}[k]||k;}
function explorer(){const m=R.metrics,d=R.daily,t=d.target,rd=d.avg_R_per_day;
  const reasons=Object.entries(R.reasons).map(([k,v])=>`<tr><td>${esc(reasonLabel(k))}</td><td class="n">${v.n}</td><td class="n">${pc(v.n/m.n_trades)}</td><td class="n ${v.mean_R>0?"win":"lose"}">${sg(v.mean_R,3)}</td><td class="n">${pc(v.win_rate)}</td></tr>`).join("");
  return `<div class="card"><h2>${esc(R.label)} · ${esc(R.instrument)} <span class="muted">${esc(R.start.slice(0,10))} → ${esc(R.end.slice(0,10))} · ${R.n_bars} barres · ${R.segment==="avant"?"années d'avant":"recherche"}</span></h2>

  <div class="kpi"><b>${f(m.profit_factor,2)}</b><span>facteur de profit</span></div><div class="kpi"><b>${pc(m.win_rate)}</b><span>trades gagnants</span></div>

  <div>${dailyChart()}</div></div></div>

   [["all","Tous"],["win","Gagnants"],["loss","Perdants"],["tp","TP"],["sl","SL"],["time","Temps / autre"]].map(([k,l])=>`<button data-fl="${k}" aria-pressed="${E.filter===k}">${l}</button>`).join("")}</div>
   <button class="sm" id="prev">◀ Précédent</button><button class="sm" id="next">Suivant ▶</button><button class="sm" id="best">Meilleur</button><button class="sm" id="worst">Pire</button><span class="muted" id="count"></span></div>

  <div class="card"><h2>Capital simulé</h2>${equity()}</div>`;}
function bindExplorer(){document.querySelectorAll("[data-fl]").forEach(b=>b.onclick=()=>{E.filter=b.dataset.fl;E.sel=0;refreshList();});
  const nav=d=>{const v=visible();if(!v.length)return;const pos=Math.max(0,v.findIndex(t=>t.i===E.sel));E.sel=v[(pos+d+v.length)%v.length].i;refreshList(true);};
  document.getElementById("prev").onclick=()=>nav(-1);document.getElementById("next").onclick=()=>nav(1);
  document.getElementById("best").onclick=()=>{E.sel=R.trades.reduce((b,t,i)=>t.r>R.trades[b].r?i:b,0);refreshList(true)};
  document.getElementById("worst").onclick=()=>{E.sel=R.trades.reduce((b,t,i)=>t.r<R.trades[b].r?i:b,0);refreshList(true)};
  document.getElementById("tbl").onkeydown=e=>{if(e.key==="ArrowDown"){e.preventDefault();nav(1)}else if(e.key==="ArrowUp"){e.preventDefault();nav(-1)}};
  document.getElementById("eout").onclick=e=>{const c=e.target.closest("[data-i]");if(c){E.sel=+c.dataset.i;refreshList(true);}};
  refreshList();}
function refreshList(scroll){const v=visible();if(!v.length){document.getElementById("tbl").innerHTML=`<p class="muted" style="padding:12px">Aucun trade pour ce filtre.</p>`;document.getElementById("detail").innerHTML="";document.getElementById("count").textContent="0 trade";return;}
  if(!v.some(t=>t.i===E.sel))E.sel=v[0].i;
  const th=(k,l,n)=>`<th class="${n?"n":""}" data-sort="${k}" style="cursor:pointer" title="Trier">${l}${E.sort[0]===k?(E.sort[1]>0?" ▲":" ▼"):""}</th>`;
  const dp=Math.abs(R.trades[0].entry)<50?5:2;
  document.getElementById("tbl").innerHTML=`<table><thead><tr>${th("i","#",1)}${th("i0","Entrée (UTC)")}<th>Sens</th><th class="n">Prix entrée</th><th class="n">SL</th><th class="n">TP</th><th class="n">Prix sortie</th><th>Motif</th>${th("held","Barres",1)}${th("r","R",1)}</tr></thead><tbody>`+
   v.map(t=>`<tr data-i="${t.i}" class="${t.i===E.sel?"sel":""}" style="cursor:pointer"><td class="n">${t.i+1}</td><td>${stamp(R.bars.t[Math.max(0,t.i0)])}</td><td>${t.side==="long"?"Achat":"Vente"}</td><td class="n">${f(t.entry,dp)}</td><td class="n lose">${t.stop?f(t.stop,dp):"—"}</td><td class="n win">${t.tp?f(t.tp,dp):"—"}</td><td class="n">${f(t.exit,dp)}</td><td>${esc(reasonLabel(t.reason))}</td><td class="n">${t.held}</td><td class="n ${t.r>0?"win":"lose"}"><b>${sg(t.r,2)}</b></td></tr>`).join("")+`</tbody></table>`;
  document.querySelectorAll("[data-sort]").forEach(h=>h.onclick=()=>{const k=h.dataset.sort;E.sort=E.sort[0]===k?[k,-E.sort[1]]:[k,k==="r"?-1:1];refreshList();});
  document.querySelectorAll("[data-fl]").forEach(b=>b.setAttribute("aria-pressed",String(E.filter===b.dataset.fl)));
  document.getElementById("count").textContent=`${v.length} / ${R.trades.length} trades`;
  document.getElementById("detail").innerHTML=detail(R.trades[E.sel],E.sel);
  if(scroll){const r=document.querySelector("tr.sel");if(r)r.scrollIntoView({block:"nearest"});}
  const ov=document.getElementById("ovsel");if(ov)ov.setAttribute("x",ovx(R.trades[E.sel].i0));}
function detail(t,idx){if(!t)return"";const dp=Math.abs(t.entry)<50?5:2,B=R.bars,ctx=Math.max(25,Math.round((t.i1-t.i0)*0.6)+20);
  const a=Math.max(0,t.i0-ctx),z=Math.min(B.t.length-1,Math.max(t.i1,t.i0)+ctx),n=z-a+1;
  const risk=t.stop?Math.abs(t.entry-t.stop):null,rew=t.tp?Math.abs(t.tp-t.entry):null;
  const W=980,H=380,pl=10,pr=132,pt=26,pb=34;
  let hi=-1e18,lo=1e18;for(let i=a;i<=z;i++){hi=Math.max(hi,B.h[i]);lo=Math.min(lo,B.l[i]);}[t.entry,t.exit,t.stop,t.tp].forEach(v=>{if(v!=null){hi=Math.max(hi,v);lo=Math.min(lo,v);}});
  const padp=(hi-lo)*.06;hi+=padp;lo-=padp;const y=v=>pt+(hi-v)/(hi-lo||1)*(H-pt-pb),bw=(W-pl-pr)/n,x=i=>pl+(i-a+.5)*bw;
  let g="";for(let k=0;k<=4;k++){const v=lo+(hi-lo)*k/4;g+=`<line class="axis" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="lbl" x="${W-pr+6}" y="${y(v)+4}">${v.toFixed(dp)}</text>`;}
  for(let k=0;k<=4;k++){const i=a+Math.round((n-1)*k/4);g+=`<text class="lbl" x="${x(i)}" y="${H-12}" text-anchor="middle">${stamp(B.t[i]).slice(5)}</text>`;}
  const x0=x(t.i0)-bw/2,x1=x(t.i1)+bw/2;
  if(t.tp)g+=`<rect x="${x0}" y="${Math.min(y(t.entry),y(t.tp))}" width="${x1-x0}" height="${Math.abs(y(t.tp)-y(t.entry))}" fill="var(--ok)" opacity=".13"/>`;
  if(t.stop)g+=`<rect x="${x0}" y="${Math.min(y(t.entry),y(t.stop))}" width="${x1-x0}" height="${Math.abs(y(t.stop)-y(t.entry))}" fill="var(--bad)" opacity=".13"/>`;
  let c="";for(let i=a;i<=z;i++){const up=B.c[i]>=B.o[i],col=up?"var(--ok)":"var(--bad)";
    c+=`<line x1="${x(i)}" x2="${x(i)}" y1="${y(B.h[i])}" y2="${y(B.l[i])}" stroke="${col}"/><rect x="${x(i)-Math.max(bw*.34,.8)}" width="${Math.max(bw*.68,1.6)}" y="${y(Math.max(B.o[i],B.c[i]))}" height="${Math.max(Math.abs(y(B.o[i])-y(B.c[i])),1)}" fill="${col}"><title>${stamp(B.t[i])} · O ${B.o[i]} H ${B.h[i]} L ${B.l[i]} C ${B.c[i]}</title></rect>`;}
  const ln=(v,col,l,d)=>v==null?"":`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="${col}" stroke-width="1.6" ${d?'stroke-dasharray="6 4"':""}/><text class="lblb" x="${W-pr+6}" y="${y(v)-3}" fill="${col}">${l} ${v.toFixed(dp)}</text>`;
  const win=t.r>0,col=win?"var(--ok)":"var(--bad)";
  const ex=`<g><line x1="${x(t.i0)}" y1="${y(t.entry)}" x2="${x(t.i1)}" y2="${y(t.exit)}" stroke="${col}" stroke-width="2.4"/><circle cx="${x(t.i0)}" cy="${y(t.entry)}" r="5" fill="${t.side==="long"?"var(--acc)":"var(--warn)"}" stroke="var(--card)" stroke-width="1.5"><title>Entrée ${t.side==="long"?"achat":"vente"} ${t.entry.toFixed(dp)}</title></circle>
   <path d="M${x(t.i1)} ${y(t.exit)-7}l7 7-7 7-7-7z" fill="${col}" stroke="var(--card)" stroke-width="1.5"><title>Sortie ${t.exit.toFixed(dp)} · ${esc(reasonLabel(t.reason))}</title></path></g>`;
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trade ${idx+1}">${g}${c}${ln(t.tp,"var(--ok)","TP",1)}${ln(t.stop,"var(--bad)","SL",1)}${ln(t.entry,"var(--acc)","ENTRÉE",0)}${ex}
   <text class="lblb" x="${pl}" y="15">Trade ${idx+1} · ${t.side==="long"?"Achat":"Vente"} · ${sg(t.r,2)} R · ${esc(reasonLabel(t.reason))}</text></svg>`;
  return `${svg}<div class="grid" style="margin-top:8px">
  <div class="kpi"><b>${t.entry.toFixed(dp)}</b><span>entrée · ${stamp(B.t[t.i0])} UTC</span></div>
  <div class="kpi"><b style="color:var(--bad)">${t.stop?t.stop.toFixed(dp):"—"}</b><span>stop (SL)${risk?` · risque ${risk.toFixed(dp)} (${pc(risk/t.entry,2)})`:""}</span></div>
  <div class="kpi"><b style="color:var(--ok)">${t.tp?t.tp.toFixed(dp):"—"}</b><span>objectif (TP)${rew&&risk?` · gain visé ${(rew/risk).toFixed(2)} R`:""}</span></div>
  <div class="kpi"><b>${t.exit.toFixed(dp)}</b><span>sortie · ${stamp(B.t[Math.max(0,t.i1)])} UTC · ${t.held} barres</span></div>
  <div class="kpi ${win?"good":"badk"}"><b>${sg(t.r,2)} R</b><span>résultat (PnL ${sg(t.pnl,2)})</span></div></div>
  <p class="muted">Zone verte = distance entrée→TP, zone rouge = entrée→SL, sur la durée du trade. Si la sortie n'est ni TP ni SL, le trade a été clôturé par le temps ou une règle de risque : le R est alors partiel.</p>`;}
function ovx(i){const W=980,pl=40,pr=12;return pl+(i/(R.bars.t.length-1||1))*(W-pl-pr);}
function overview(){const B=R.bars,n=B.t.length,W=980,H=210,pl=40,pr=12,pt=20,pb=24,step=Math.max(1,Math.floor(n/700));
  let hi=-1e18,lo=1e18;for(let i=0;i<n;i++){hi=Math.max(hi,B.h[i]);lo=Math.min(lo,B.l[i]);}const y=v=>pt+(hi-v)/(hi-lo||1)*(H-pt-pb),x=i=>pl+i/(n-1||1)*(W-pl-pr);
  let pts="";for(let i=0;i<n;i+=step)pts+=`${x(i).toFixed(1)},${y(B.c[i]).toFixed(1)} `;
  let g="";for(let k=0;k<=3;k++){const v=lo+(hi-lo)*k/3;g+=`<line class="axis" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text class="lbl" x="${pl-4}" y="${y(v)+4}" text-anchor="end">${v>1000?v.toFixed(0):v.toFixed(3)}</text>`;}
  const tr=R.trades.map((t,i)=>`<g data-i="${i}" style="cursor:pointer"><line x1="${x(t.i0)}" x2="${x(t.i1)}" y1="${y(t.entry)}" y2="${y(t.exit)}" stroke="${t.r>0?"var(--ok)":"var(--bad)"}" stroke-width="3"/><circle cx="${x(t.i0)}" cy="${y(t.entry)}" r="3.4" fill="${t.side==="long"?"var(--acc)":"var(--warn)"}"><title>#${i+1} ${t.side==="long"?"achat":"vente"} · ${sg(t.r,2)} R · ${esc(reasonLabel(t.reason))}</title></circle></g>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Prix et trades">${g}<polyline fill="none" stroke="var(--mute)" stroke-width="1.1" points="${pts}"/><rect id="ovsel" x="${ovx(R.trades[E.sel]?R.trades[E.sel].i0:0)}" y="${pt}" width="3" height="${H-pt-pb}" fill="var(--acc)" opacity=".35"/>${tr}
  <text class="lbl" x="${pl}" y="13">${stamp(B.t[0]).slice(0,10)} → ${stamp(B.t[n-1]).slice(0,10)} · trait vert/rouge = trade gagnant/perdant · point bleu = achat, orange = vente</text></svg>`;}
function equity(){const pts=R.equity;if(!pts||pts.length<2)return"";const W=980,H=190,p=44;const ys=pts.map(a=>a[1]);const lo=Math.min(...ys),hi=Math.max(...ys),y=v=>14+(hi-v)/(hi-lo||1)*(H-40),x=i=>p+i/(pts.length-1)*(W-p-12);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Capital simulé"><line class="axis" x1="${p}" x2="${W-12}" y1="${y(pts[0][1])}" y2="${y(pts[0][1])}"/><polyline fill="none" stroke="var(--acc)" stroke-width="2" points="${pts.map((a,i)=>x(i)+","+y(a[1])).join(" ")}"/>
  <text class="lbl" x="${p-4}" y="${y(hi)+4}" text-anchor="end">${hi.toFixed(0)}</text><text class="lbl" x="${p-4}" y="${y(lo)+4}" text-anchor="end">${lo.toFixed(0)}</text><text class="lbl" x="${p}" y="${H-6}">${esc(pts[0][0].slice(0,10))}</text><text class="lbl" x="${W-12}" y="${H-6}" text-anchor="end">${esc(pts[pts.length-1][0].slice(0,10))}</text></svg>`;}
function dailyChart(){const d=R.daily,s=d.series;if(!s||!s.length)return `<p class="muted">Aucun jour avec trade.</p>`;const W=520,H=210,p=34,t=d.target;
  const vals=s.map(a=>a[1]),hi=Math.max(t,...vals,.1),lo=Math.min(0,...vals,-.1),y=v=>18+(hi-v)/(hi-lo)*(H-44),bw=(W-p-8)/s.length;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="R par jour"><line class="axis" x1="${p}" x2="${W-8}" y1="${y(0)}" y2="${y(0)}"/><line x1="${p}" x2="${W-8}" y1="${y(t)}" y2="${y(t)}" stroke="var(--warn)" stroke-dasharray="5 4"/>
  <text class="lbl" x="${p+2}" y="${y(t)-4}" fill="var(--warn)">objectif ${f(t,2)} R</text>`+
  s.map((a,i)=>`<rect x="${p+i*bw}" width="${Math.max(bw-1,1)}" y="${Math.min(y(0),y(a[1]))}" height="${Math.max(Math.abs(y(a[1])-y(0)),1)}" fill="${a[1]>=0?"var(--ok)":"var(--bad)"}"><title>${a[0]} : ${sg(a[1],2)} R</title></rect>`).join("")+
  `<text class="lbl" x="${p}" y="12">R par jour de sortie (jours avec trade)</text></svg>`;}

/* ---------- orchestration ---------- */
function render(){tabs();pills();clearInterval(timer);
  const v=({synthese,essai,res,wf,cal,data,live})[tab];$("#view").innerHTML=S?v():`<div class="card"><div class="skel"></div></div>`;
  if(tab==="essai"){if(!ST)api("/api/strategies").then(x=>{ST=x;if(tab==="essai"){$("#view").innerHTML=essai();bindEssai();}}).catch(e=>toast("Erreur : "+e.message));else bindEssai();}
  if(tab==="live"){loadLive();timer=setInterval(loadLive,5000);}window.scrollTo({top:0});}
async function boot(){const h=location.hash.slice(1);tab=TABS.some(t=>t[0]===h)?h:(TABS.some(t=>t[0]===store.get("tab","synthese"))?store.get("tab","synthese"):"synthese");
  tabs();try{S=await api("/api/state");banner();}catch(e){$("#view").innerHTML=`<div class="card"><h2>Interface non joignable</h2><p class="muted">${esc(e.message)}</p></div>`;return;}
  try{L=await api("/api/live");}catch(e){}render();setInterval(async()=>{try{L=await api("/api/live");S.daemon=(await api("/api/state")).daemon;pills();}catch(e){}},15000);}
boot();
</script>
