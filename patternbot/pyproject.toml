[project]
name = "patternbot"
version = "0.1.0"
description = "Self-improving pattern-based trading bot (isolated from Nexus)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
exchange = ["ccxt>=4.0"]
ai = ["anthropic>=0.40", "openai>=1.50"]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
